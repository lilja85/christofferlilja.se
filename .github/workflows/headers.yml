name: Säkerhetsheaders

# Kontrollerar varje vecka att produktionen skickar säkerhetsheaders. Webbhotellet kan ändra sin
# nginx-konfiguration utan att vi deployar något, och då märks det annars först i securityheaders.com.
on:
  schedule:
    - cron: '17 6 * * 1' # måndagar 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-live-headers.mjs
